<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>צ'אט עם Claude · עברית</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="layout">
    <!-- סרגל היסטוריה -->
    <aside id="sidebar">
      <button id="new-chat" class="new-chat-btn">+ שיחה חדשה</button>
      <div class="sidebar-title">היסטוריה</div>
      <div id="sessions" class="sessions"></div>
    </aside>

    <div id="app">
      <header>
        <div class="brand">
          <button id="toggle-sidebar" class="icon-btn" title="היסטוריה">☰</button>
          <span class="dot"></span>
          <h1>צ'אט עם Claude</h1>
        </div>
        <div class="header-controls">
          <select id="model" title="בחירת מודל">
            <option value="claude-sonnet-4-6">Sonnet 4.6 (מהיר)</option>
            <option value="claude-opus-4-8">Opus 4.8 (חזק)</option>
            <option value="claude-haiku-4-5-20251001">Haiku 4.5 (קליל)</option>
          </select>
        </div>
      </header>

      <main id="messages">
        <div class="welcome">
          <h2>שלום 👋</h2>
          <p>זה ממשק צ'אט בעברית מלאה (ימין-לשמאל) מול Claude, עם יכולת להריץ פקודות ולערוך קבצים בתיקיית העבודה שלך.</p>
          <p class="muted" id="workdir-line"></p>
        </div>
      </main>

      <footer>
        <div id="attachments" class="attachments"></div>
        <form id="composer">
          <button id="attach" type="button" class="icon-btn attach-btn" title="צרף קובץ">📎</button>
          <input type="file" id="file-input" multiple hidden />
          <textarea id="input" rows="1" placeholder="כתוב הודעה… (Enter לשליחה, Shift+Enter לשורה חדשה. אפשר גם להדביק או לגרור קובץ)" autofocus></textarea>
          <button id="send" type="submit" title="שלח">שלח</button>
        </form>
        <div class="hint">הכלים פועלים על המחשב שמריץ את השרת. הרץ רק פקודות שאתה סומך עליהן.</div>
      </footer>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
